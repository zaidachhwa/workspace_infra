# Dashboard frontend. SSL managed by certbot (`certbot --nginx`) — the 443
# block, the redirect block below, and the `# managed by Certbot` comments
# were all generated by certbot itself, not written by hand. This file is
# what certbot auto-renews against; edit the proxy_pass/location block if
# needed, but leave the certbot-managed parts alone.
server {
    server_name workspace.keyset.in;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/workspace.keyset.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/workspace.keyset.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = workspace.keyset.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name workspace.keyset.in;
    return 404; # managed by Certbot


}

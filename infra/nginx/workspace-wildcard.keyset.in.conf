# Every individual workspace (<slug>.workspace.keyset.in) — proxied to Traefik,
# which routes to the right container by Host header. nginx matches this only
# when no more specific server_name (workspace.keyset.in, api.workspace.keyset.in)
# already matched, so those two keep working unaffected by this wildcard.
#
# WebSocket upgrade headers are required here — code-server's editor, terminal,
# and live reload all run over WebSocket. Without these, the IDE loads but the
# terminal and file sync silently don't work.
#
# SSL here is a WILDCARD cert obtained manually (`certbot certonly --manual
# --preferred-challenges dns`, since wildcards need DNS-01) — it does NOT
# auto-renew. See docs/security.md. Note the cert path below is suffixed
# "-0001": certbot appends this because "workspace.keyset.in" was already
# taken by the Stage A cert above when this one was issued.
server {
    listen 80;
    listen [::]:80;
    server_name *.workspace.keyset.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name *.workspace.keyset.in;

    ssl_certificate /etc/letsencrypt/live/workspace.keyset.in-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workspace.keyset.in-0001/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}

# Backend API. SSL managed by certbot (`certbot --nginx`) — see the note in
# workspace.keyset.in.conf; the same applies here.
server {
    server_name api.workspace.keyset.in;

    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/workspace.keyset.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/workspace.keyset.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = api.workspace.keyset.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name api.workspace.keyset.in;
    return 404; # managed by Certbot


}

# Backend API. HTTP only for now — add SSL (certbot) once this routes correctly.
server {
    listen 80;
    listen [::]:80;
    server_name api.workspace.keyset.in;

    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cookies are how auth works here (httpOnly access/refresh tokens) — nothing
        # to rewrite as long as CORS_ORIGIN in backend/.env matches the dashboard's
        # real origin exactly.
    }
}
